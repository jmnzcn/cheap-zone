name: backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas del motor
        run: pytest -q
      - name: Backtest diario (SPY desde 2005)
        run: python run_backtest.py --interval 1d --outdir resultados/diario
      - name: Backtest por hora (SPY, ~720 días)
        continue-on-error: true
        run: python run_backtest.py --interval 1h --outdir resultados/hora
      - name: Diagnóstico de la señal (variantes, períodos, otros índices)
        run: python diagnostico.py
      - name: Estrategias con respaldo publicado
        run: python estrategias.py
      - name: Robustez de la reversión a la media con RSI
        run: python rsi2_robustez.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados
          path: resultados/
