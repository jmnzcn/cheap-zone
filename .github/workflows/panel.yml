name: panel

on:
  schedule:
    - cron: "45 21 * * 1-5"    # días hábiles, después del cierre de Nueva York
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python panel.py
      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel/
          git diff --cached --quiet || git commit -m "Actualiza los datos del panel"
          git push
